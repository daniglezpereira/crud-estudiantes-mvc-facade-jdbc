<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Detalle de estudiante</title>
</head>

<body>

    <h1>Detalle de estudiante</h1>

    <table border="1">
        <tr>
            <td>Nombre</td>
            <td th:text="${estudiante.nombre}"></td>
        </tr>
        <tr>
            <td>Apellido</td>
            <td th:text="${estudiante.primerApellido + ' ' + estudiante.segundoApellido}"></td>
        </tr>
        <tr>
            <td>Email</td>
            <td th:text="${estudiante.correos[0].email}"></td>
        </tr>
        <tr>
            <td>Foto</td>
            <td>
                <img th:src="@{/estudiantes/fotos/{id}(id=${estudiante.id})}" width="200" height="200"
                    alt="Foto del estudiante" />
            </td>
        </tr>
    </table>


    <a href="/estudiantes/listar">Volver</a>

</body>

</html>
